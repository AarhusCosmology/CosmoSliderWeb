<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoSliderWeb</title>
    <base target="_parent">
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/app_logo.ico" type="image/x-icon">
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.4.0/dist/tf.min.js"></script>
    <!-- TFLite browser runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
    <!-- Read the packaged model archive -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <!-- Load Highcharts -->
    <script src="https://code.highcharts.com/12.6.2/highcharts.js"></script>
    <script src="https://code.highcharts.com/12.6.2/highcharts-more.js"></script>
    <!-- Load custom script -->
    <script src="script.js" defer></script>
    <!-- Load custom styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
      <h1 class="header-text">CosmoSlider</h1>

      <div class="toggle-checkbox-wrapper">
        <input
          class="toggle-checkbox"
          type="checkbox"
          id="toggle"
          onchange="showData(this)"
        >
        <label for="toggle" class="check-slider"></label>
        <span class="toggle-text">Show data</span>
      </div>

      <div class="control-stack">
        <button id="toggleDarkMode" class="stack-control">
          Appearance
        </button>

        <button
          onclick="resetGraphToBestfit()"
          class="stack-control"
        >
          Best-fit
        </button>

        <select
          id="observableDropdown"
          class="stack-control"
          aria-label="Observable"
          onchange="handleObservableSelection(event)"
        ></select>

        <select
          id="dropdown"
          class="stack-control"
          aria-label="Spectrum"
          onchange="handleSelection(event)"
        ></select>
      </div>
    </header>

    <div class="container-side-by-side">
        <!-- Canvas for the chart -->
        <div id="outputChart" class="chart"></div>

        <!-- Sliders for input dimensions -->
        <div id="sliders" class="all-sliders-container"></div>
    </div>

    <div class="app-download-section">
        <a href="https://apps.apple.com/us/app/cosmoslider/id6504750261?itsct=apps_box_badge&amp;itscg=30200" style="display: inline-block; overflow: hidden; border-radius: 13px; width: 250px; height: 83px;">
            <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&amp;releaseDate=1719273600" alt="Download on the App Store" style="border-radius: 13px; width: 250px; height: 83px;">
        </a>
    </div>

    <footer class="credits">
        <p>Author: Andreas Nygaard</p>
        <a href="mailto:andreas@phys.au.dk">andreas@phys.au.dk</a>
    </footer>

    <div class="buymeacoffee-section">
        <a href="https://buymeacoffee.com/andreasnygaard" style="display: inline-block; overflow: hidden; border-radius: 13px; width: 250px; height: auto;">
            <img src="./assets/bmac.png" alt="Buy me a coffee and support my work" style="border-radius: 13px; width: 250px; height: auto;">
        </a>
    </div>
</body>
</html>
